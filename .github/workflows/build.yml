name: Build Bolt Supply

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Checkout KenshiLib build dependencies
        uses: actions/checkout@v4
        with:
          repository: BFrizzleFoShizzle/KenshiLib_Examples_deps
          ref: master
          path: third_party/KenshiLib_deps
          lfs: true

      - name: Prepare build dependencies
        shell: pwsh
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE "third_party/KenshiLib_deps"
          $nugetRoot = Join-Path $env:GITHUB_WORKSPACE "third_party/nuget"
          if (Test-Path $nugetRoot) {
            Remove-Item $nugetRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $nugetRoot | Out-Null
          nuget install boost-vc140 -Version 1.60.0 -OutputDirectory $nugetRoot -NonInteractive -ExcludeVersion
          $boostThreadLib = Get-ChildItem $nugetRoot -Filter "libboost_thread-vc140-mt-1_60.lib" -Recurse -File |
            Where-Object { $_.FullName -match "address-model-64\\lib\\libboost_thread-vc140-mt-1_60\.lib$" } |
            Select-Object -First 1
          $boostSystemLib = Get-ChildItem $nugetRoot -Filter "libboost_system-vc140-mt-1_60.lib" -Recurse -File |
            Where-Object { $_.FullName -match "address-model-64\\lib\\libboost_system-vc140-mt-1_60\.lib$" } |
            Select-Object -First 1

          if (!$boostThreadLib) {
            throw "VC140 Boost 1.60 x64 thread library was not found after NuGet installation."
          }
          if (!$boostSystemLib) {
            throw "VC140 Boost 1.60 x64 system library was not found after NuGet installation."
          }

          Write-Host "Boost thread library: $($boostThreadLib.FullName)"
          Write-Host "Boost system library: $($boostSystemLib.FullName)"

          $boostLibraryPathArgs = @(
            '/LIBPATH:"' + $boostThreadLib.Directory.FullName + '"'
            '/LIBPATH:"' + $boostSystemLib.Directory.FullName + '"'
          ) -join " "
          "BOOST_VC140_LIBRARY_PATH_ARGS=$boostLibraryPathArgs" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $kenshiLib = Join-Path $deps "KenshiLib"
          $boostZip = Join-Path $deps "boost_1_60_0/boost.zip"
          $boostExtract = Join-Path $deps "boost_extracted"
          if (!(Test-Path (Join-Path $kenshiLib "Include"))) { throw "KenshiLib Include directory was not found." }
          if (!(Test-Path (Join-Path $kenshiLib "Libraries"))) { throw "KenshiLib Libraries directory was not found." }
          if (!(Test-Path $boostZip)) { throw "Boost archive was not found: $boostZip" }
          if (Test-Path $boostExtract) { Remove-Item $boostExtract -Recurse -Force }
          Expand-Archive -Path $boostZip -DestinationPath $boostExtract -Force
          $boostHeader = Get-ChildItem $boostExtract -Filter "unordered_map.hpp" -Recurse -File |
            Where-Object { $_.FullName -match "\\boost\\unordered_map\.hpp$" } | Select-Object -First 1
          if (!$boostHeader) { throw "Boost unordered_map.hpp was not found." }
          $boost = $boostHeader.Directory.Parent.FullName
          $boostLibDir = Join-Path $boost "stage/lib"
          if (!(Test-Path $boostLibDir)) { throw "Boost library directory was not found: $boostLibDir" }
          "KENSHILIB_DIR=$kenshiLib" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_INCLUDE_PATH=$boost" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_LIBRARY_PATH=$boostLibDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with MSVC (Nitoryu-style)
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Microsoft Visual Studio/Installer/vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) { throw "A Visual C++ x64 toolchain was not found." }

          $vcvars = Join-Path $vsPath "VC/Auxiliary/Build/vcvars64.bat"
          $dumpbin = Get-ChildItem (Join-Path $vsPath "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") |
            Select-Object -First 1
          if (!(Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          if (!$dumpbin) { throw "dumpbin.exe not found." }

          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          $obj = Join-Path $buildDir "BoltSupply.obj"
          $out = Join-Path $buildDir "BoltSupply.dll"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          Write-Host "Using Visual Studio: $vsPath"

          $compileCmd = '"' + $vcvars + '" && cl /nologo /c /EHsc /O2 /MD /std:c++17 /I"' + $env:KENSHILIB_DIR + '/Include" /I"' + $env:KENSHILIB_DIR + '/Include/ogre" /I"' + $env:BOOST_INCLUDE_PATH + '" /Fo"' + $obj + '" "src/BoltSupply.cpp"'
          cmd.exe /d /c $compileCmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC compilation failed with exit code $LASTEXITCODE" }

          $directives = & $dumpbin.FullName /directives $obj 2>&1 | Out-String
          Write-Host "Compiler linker directives:"
          Write-Host $directives

          $boostNames = $directives -split '\\s+' |
            Where-Object { $_ -like '/DEFAULTLIB:libboost_*.lib' } |
            ForEach-Object { $_.Substring(12) } |
            Sort-Object -Unique

          $boostArgs = @()
          foreach ($name in $boostNames) {
            $match = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "third_party/nuget") -Filter $name -Recurse -File |
              Where-Object { $_.FullName -match "address-model-64\\lib\\$([regex]::Escape($name))$" } |
              Select-Object -First 1
            if (!$match) {
              throw "Required VC140 x64 Boost library was not found: $name"
            }
            Write-Host "Resolved Boost dependency: $($match.FullName)"
            $boostArgs += '"' + $match.FullName + '"'
          }

          $kenshiLib = Join-Path $env:KENSHILIB_DIR "Libraries/kenshilib.lib"
          $ogreLib = Join-Path $env:KENSHILIB_DIR "Libraries/OgreMain_x64.lib"
          $myguiLib = Join-Path $env:KENSHILIB_DIR "Libraries/MyGUIEngine_x64.lib"

          foreach ($required in @($kenshiLib, $ogreLib, $myguiLib)) {
            if (!(Test-Path $required)) {
              throw "Required KenshiLib library was not found: $required"
            }
          }

          $linkInputs = '"' + $obj + '" "' + $kenshiLib + '" "' + $ogreLib + '" "' + $myguiLib + '"'
          if ($boostArgs.Count -gt 0) {
            $linkInputs += " " + ($boostArgs -join " ")
          }

          $linkCmd = '"' + $vcvars + '" && cl /nologo /LD /O2 /MD /Fe"' + $out + '" ' + $linkInputs
          cmd.exe /d /c $linkCmd
          if ($LASTEXITCODE -ne 0) { throw "MSVC link failed with exit code $LASTEXITCODE" }

      - name: Verify DLL export
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "build/BoltSupply.dll"
          if (!(Test-Path $dll)) { throw "BoltSupply.dll was not produced." }
          $vswhere = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vsPath "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") | Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin.exe not found." }
          $exports = & $dumpbin.FullName /exports $dll 2>&1 | Out-String
          Write-Host $exports
          if ($exports -notmatch "startPlugin") { throw "Expected startPlugin export was not found." }

      - name: Assemble mod package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "package/RE_Kenshi Bolt Supply"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/RE_Kenshi Bolt Supply.mod" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE/RE_Kenshi.json" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE/build/BoltSupply.dll" $packageRoot
          $zip = Join-Path $env:GITHUB_WORKSPACE "RE_Kenshi-Bolt-Supply.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zip -Force

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: RE-Kenshi-Bolt-Supply
          path: RE-Kenshi-Bolt-Supply.zip
          if-no-files-found: error
